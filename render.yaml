services:
  - type: web
    name: aetherops-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
